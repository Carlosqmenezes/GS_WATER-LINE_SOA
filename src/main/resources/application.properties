# Aplicação
spring.application.name=alertas-service
spring.profiles.default=dev
server.port=${PORTA:5090}

# Banco próprio
spring.datasource.url=${ALERTAS_DB_URL:jdbc:postgresql://localhost:5433/waterline_alertas}
spring.datasource.username=${ALERTAS_DB_USUARIO:waterline_alertas}
spring.datasource.password=${ALERTAS_DB_SENHA:}

# JPA e migrations
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# Documentação
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.path=/v3/api-docs

# Regras de alerta
alertas.raio-consulta-metros=1000
alertas.validade=2h
